  <script>
    const contactForm = document.getElementById('contactForm');
    const contactPhone = document.getElementById('contactPhone');

    contactPhone?.addEventListener('input', () => {
      const marathiDigits = '०१२३४५६७८९';
      contactPhone.value = contactPhone.value
        .replace(/[०-९]/g, (digit) => String(marathiDigits.indexOf(digit)))
        .replace(/\D/g, '')
        .slice(0, 10);
      contactPhone.setCustomValidity('');
    });

    contactForm?.addEventListener('submit', (event) => {
      event.preventDefault();
      document.getElementById('contactSubmitButton')?.click();
    });

    document.getElementById('contactSubmitButton')?.addEventListener('click', async (event) => {
      event.preventDefault();
      event.stopPropagation();
      const form = contactForm;
      const statusBox = document.getElementById('contactFormStatus');
      const statusText = document.getElementById('contactFormStatusText');
      const statusIcon = statusBox.querySelector('.contact-form-status-icon');
      const closeButton = statusBox.querySelector('.contact-form-status-close');
      const submitButton = document.getElementById('contactSubmitButton');
      const phone = contactPhone.value.trim();
      if (phone && !/^[6-9]\d{9}$/.test(phone)) {
        contactPhone.setCustomValidity('कृपया ६ ते ९ ने सुरू होणारा १० अंकी फोन नंबर लिहा.');
      } else {
        contactPhone.setCustomValidity('');
      }
      if (!form.reportValidity()) return;
      const data = new FormData(form);
      const payload = Object.fromEntries(data.entries());
      statusBox.className = 'contact-form-status';
      statusText.textContent = '';
      submitButton.disabled = true;
      submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> पाठवत आहे...';
      const showStatus = (type, message) => {
        statusBox.className = `contact-form-status ${type}`;
        statusIcon.className = `contact-form-status-icon fas ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}`;
        statusText.textContent = message;
      };
      closeButton.onclick = () => statusBox.classList.remove('success', 'error');
      const requestController = new AbortController();
      const requestTimeout = window.setTimeout(() => requestController.abort(), 15000);
      try {
        const response = await fetch('/api/contact-inquiries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload),
          credentials: 'same-origin',
          signal: requestController.signal
        });
        const responseText = await response.text();
        let result = {};
        try {
          result = responseText ? JSON.parse(responseText) : {};
        } catch (parseError) {
          if (!response.ok) throw new Error('सर्व्हरकडून योग्य प्रतिसाद मिळाला नाही. कृपया पुन्हा प्रयत्न करा.');
        }
        if (!response.ok) throw new Error(result.message || 'संदेश पाठवता आला नाही.');
        form.reset();
        showStatus('success', result.message || 'तुमचा संदेश यशस्वीरित्या पाठवला गेला आहे.');
      } catch (error) {
        const message = error.name === 'AbortError'
          ? 'सर्व्हरकडून प्रतिसाद मिळाला नाही. कृपया पुन्हा प्रयत्न करा.'
          : error.message || 'संदेश पाठवता आला नाही. कृपया पुन्हा प्रयत्न करा.';
        showStatus('error', message);
      } finally {
        window.clearTimeout(requestTimeout);
        submitButton.disabled = false;
        submitButton.innerHTML = '<i class="fas fa-paper-plane"></i> पाठवा';
      }
    });
  </script>
